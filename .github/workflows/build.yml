name: Build de produção

on:
  push:
    branches:
      - feature/vite-build
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Executar build e smoke test
        run: npm test

      - name: Medir redução dos ficheiros
        run: npm run metrics

      - name: Validar preview HTTP
        run: |
          npm run preview -- --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          sleep 2
          curl --fail http://127.0.0.1:4173/html/ > /tmp/index-build.html
          grep -q 'id="app"' /tmp/index-build.html
          kill $PREVIEW_PID
