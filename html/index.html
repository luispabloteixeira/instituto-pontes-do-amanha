<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Instituto Pontes do Amanhã: educação, inclusão digital e apoio comunitário.">
  <title>Instituto Pontes do Amanhã</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/accessibility.css">
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="#/inicio" data-route aria-label="Página inicial do Instituto Pontes do Amanhã">Pontes do Amanhã</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">
        <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span><span>Menu</span>
      </button>
      <nav aria-label="Navegação principal">
        <ul id="menu" class="menu">
          <li><a href="#/inicio" data-route data-nav="inicio">Início</a></li>
          <li><a href="#/projetos" data-route data-nav="projetos">Projetos</a></li>
          <li><a href="#/cadastro" data-route data-nav="cadastro">Participe</a></li>
          <li class="nav-dropdown">
            <button class="dropdown-toggle" type="button" aria-expanded="false" aria-controls="submenu-participar">Como ajudar <span aria-hidden="true">▾</span></button>
            <ul id="submenu-participar" class="submenu" hidden>
              <li><a href="#/projetos" data-route>Voluntariado</a></li>
              <li><a href="#/projetos" data-route>Doações</a></li>
              <li><a href="#/cadastro" data-route>Fazer cadastro</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="app" class="route-view" tabindex="-1" aria-live="polite"></main>

  <footer>
    <div class="container">
      <p>© 2026 Instituto Pontes do Amanhã • Projeto acadêmico fictício</p>
      <a href="#/componentes" data-route>Guia de componentes</a>
    </div>
  </footer>

  <div class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" id="global-toast" hidden>
      <div><strong id="global-toast-title">Atualização</strong><p id="global-toast-message"></p></div>
      <button type="button" id="close-global-toast" aria-label="Fechar notificação">×</button>
    </div>
  </div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
